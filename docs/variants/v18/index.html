<title>Cambusa · 3D-модель шкафа</title>
<style>
:root {color-scheme:light dark;--font-size-base:16px;font:16px/1.45 system-ui,sans-serif}
body {max-width:850px;padding:24px 18px;margin:auto}

.viz-controls {display:flex;gap:12px 22px;flex-wrap:wrap;align-items:center}
.form-label {display:grid;gap:4px}

<main>
<div id="cambusa-frame-v18">
  <h2>Cambusa v18</h2>
  <div class="viz-controls">
    <label class="form-label">Вид
      <select class="form-select" id="v18-mode">
        <option value="closed">Двери закрыты</option>
        <option value="open">Двери открыты на 180°</option>
        <option value="parked">Двери на 270° · выносная ось</option>

    </label>

      <input class="form-range" id="v18-yaw" type="range" min="-180" max="180" value="-27">

  </div>

  <p id="v18-status" class="text-small" role="status"></p>
  <span id="v18-color" class="sr-only" aria-hidden="true"></span>
</div>

    closed:'1000 × 1800 × 500 мм · облицовка и полки 12 мм',
    open:'Расчётное положение 180° · ход петли проверяется отдельно',
    parked:'270° · створки вдоль боковин · расчётная выносная ось',
    frame:'4 стойки · 8 опор под полками'
  };
  if (!gl) {
    status.textContent = 'Для вращения модели нужен браузер с WebGL.';
    return;
  }
  function shader(type, source) {
    const result = gl.createShader(type);
    gl.shaderSource(result, source);
    gl.compileShader(result);
    if (!gl.getShaderParameter(result, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(result));
    return result;
  }
  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, `
    attribute vec3 position;
    attribute vec3 normal;
    uniform vec3 right, up, camera, center, paint;
    uniform vec2 scale;
    varying vec3 color;
    void main() {
      vec3 p = position - center;
      gl_Position = vec4(dot(p,right)*scale.x,dot(p,up)*scale.y,-dot(p,camera)/2200.,1.);
      float shade = .64 + .40 * max(0.,dot(normal,normalize(vec3(-.36,-.57,.74))));
      color = paint * shade;
    }
  `));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    varying vec3 color;
    void main() {gl_FragColor=vec4(color,1.);}
  `));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  gl.enable(gl.DEPTH_TEST);
  const uniforms = Object.fromEntries(
    ['right','up','camera','center','paint','scale'].map(name => [name,gl.getUniformLocation(program,name)])
  );
  const position = gl.getAttribLocation(program,'position'), normal = gl.getAttribLocation(program,'normal');
  gl.enableVertexAttribArray(position);
  gl.enableVertexAttribArray(normal);
  const radians = Math.PI / 180;
  const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

  function prepare(part, transform) {
    const vertices = transform ? part.v.map(transform) : part.v;
    const floats = new Float32Array(part.f.length * 18);
    let offset = 0;
    for (const [i,j,k] of part.f) {
      const a = vertices[i], b = vertices[j], c = vertices[k];
      const [x,y,z] = b.map((v,d) => v-a[d]), [u,v,w] = c.map((value,d) => value-a[d]);
      const n = [y*w-z*v,z*u-x*w,x*v-y*u];
      const length = Math.hypot(...n) || 1;
      const unit = n.map(value => value/length);
      for (const point of [a,b,c]) {
        floats.set(point,offset);
        floats.set(unit,offset+3);
        offset += 6;
      }
    }
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, floats, gl.STATIC_DRAW);
    return {buffer, count:part.f.length*3, material:part.m, group:part.g, vertices};
  }

  const closed = model.parts.map(part => prepare(part,false));
  const opened = model.parts.map((part,i) => part.g === 'door'
    ? prepare(part, ([x,y,z]) => [part.a-x,-5-y,z])
    : closed[i]);
  // At 270° the two leaves wrap around the front corners. Axes match study_270.py.
  const parked = model.parts.map((part,i) => {
    if (part.g !== 'door') return closed[i];
    const left = part.a < 1000;
    return prepare(part, ([x,y,z]) => left ? [-5-y,x-5,z] : [1005+y,995-x,z]);
  });
  const models = {closed,open:opened,parked,frame:closed.filter(part => ['profile','foot'].includes(part.group))};
  const probe = get('color');
  const palette = {};
  function colors() {
    for (const key of new Set(closed.map(part => part.material))) {
      probe.style.color = 'var(--v18-' + key + ')';
      palette[key] = getComputedStyle(probe).color.match(/[\d.]+/g).slice(0,3).map(value => Number(value)/255);
    }
  }
  const startParked = root.dataset.defaultView === 'parked' ||
    new URLSearchParams(window.location.search).get('view') === '270';
  let state = startParked ? {view:'parked',yaw:-43,pitch:24} : {view:'closed',yaw:-27,pitch:13};
  let drag = null;
  function draw() {
    const width = canvas.clientWidth, height = canvas.clientHeight;
    if (!width || !height) return;
    const density = Math.min(window.devicePixelRatio || 1,2);
    canvas.width = Math.round(width*density);
    canvas.height = Math.round(height*density);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const a = state.yaw*radians, b = state.pitch*radians;
    const right = [Math.cos(a),Math.sin(a),0];
    const up = [-Math.sin(a)*Math.sin(b),Math.cos(a)*Math.sin(b),Math.cos(b)];
    const camera = [Math.sin(a)*Math.cos(b),-Math.cos(a)*Math.cos(b),Math.sin(b)];
    const parts = models[state.view];
    let left=Infinity, bottom=Infinity, rightmost=-Infinity, top=-Infinity;
    for (const part of parts) for (const point of part.vertices) {
      const x=dot(point,right), y=dot(point,up);
      left=Math.min(left,x); rightmost=Math.max(rightmost,x);
      bottom=Math.min(bottom,y); top=Math.max(top,y);
    }
    const cx=(left+rightmost)/2, cy=(bottom+top)/2, cz=dot([500,250,900],camera);
    const center=right.map((v,i) => v*cx+up[i]*cy+camera[i]*cz);
    const scale=Math.min((width-22)/(rightmost-left),(height-20)/(top-bottom));
    gl.uniform3fv(uniforms.right,right);
    gl.uniform3fv(uniforms.up,up);
    gl.uniform3fv(uniforms.camera,camera);
    gl.uniform3fv(uniforms.center,center);
    gl.uniform2f(uniforms.scale,2*scale/width,2*scale/height);
    for (const part of parts) {
      gl.bindBuffer(gl.ARRAY_BUFFER,part.buffer);
      gl.vertexAttribPointer(position,3,gl.FLOAT,false,24,0);
      gl.vertexAttribPointer(normal,3,gl.FLOAT,false,24,12);
      gl.uniform3fv(uniforms.paint,palette[part.material]);
      gl.drawArrays(gl.TRIANGLES,0,part.count);
    }
  }

  function sync() {
    mode.value = state.view;
    yaw.value = state.yaw;
    get('angle').textContent = Math.round(state.yaw) + '°';
    if (status.textContent !== labels[state.view]) status.textContent = labels[state.view];
    draw();
  }
  function restore(saved) {
    if (saved?.modelContent?.version === 'cambusa-v18') {
      const view = saved.modelContent.view;
      if (Object.hasOwn(models,view)) state.view = view;
      for (const [key,min,max] of [['yaw',-180,180],['pitch',-10,65]]) {
        const value = saved.privateContent?.[key];
        if (Number.isFinite(value)) state[key] = Math.max(min,Math.min(max,value));
      }
    }
    sync();
  }
  function save() {
    window.openai?.setWidgetState?.({
      modelContent:{version:'cambusa-v18',view:state.view},
      privateContent:{yaw:state.yaw,pitch:state.pitch}
    })?.catch(() => {});
  }
  mode.addEventListener('change',() => {
    state.view=mode.value;
    if (state.view === 'parked') {
      state.yaw=-43;
      state.pitch=24;
    }
    sync();
    save();
  });
  yaw.addEventListener('input',() => {state.yaw=Number(yaw.value); sync();});
  yaw.addEventListener('change',save);
  canvas.addEventListener('pointerdown',event => {
    drag=[event.clientX,event.clientY,state.yaw,state.pitch];
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove',event => {
    if (!drag) return;
    state.yaw=((drag[2]+(event.clientX-drag[0])*.55+540)%360)-180;
    state.pitch=Math.max(-10,Math.min(65,drag[3]+(event.clientY-drag[1])*.25));
    sync();
  });
  canvas.addEventListener('pointerup',() => {drag=null; save();});
  canvas.addEventListener('pointercancel',() => {drag=null;});
  new ResizeObserver(draw).observe(canvas);
  new MutationObserver(() => {colors(); draw();}).observe(document.documentElement,{
    attributes:true,attributeFilter:['class','style','data-theme']
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',() => {colors(); draw();});
  window.addEventListener('openai:set_globals',event => restore(event.detail?.globals?.widgetState));
  colors();
  restore(window.openai?.widgetState);
})();
</script>
