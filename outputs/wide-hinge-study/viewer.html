<section id="cambusa-wide-hinge-170">
  <h2>Cambusa · левая дверь 170°</h2>
  <div class="viz-controls">
    <label class="form-label" for="cw170-model">Вид
      <select class="form-select" id="cw170-model">
        <option value="full">Шкаф целиком</option>
        <option value="axis-l">Ось слева · разрез крепления</option>
        <option value="axis-r">Ось справа · разрез крепления</option>
        <option value="section">Крепление 18 мм · разрез</option>
        <option value="mount">Крепление 18 мм · целиком</option>
        <option value="right">Правые полки · в каркасе</option>
        <option value="frame">Весь каркас и крепёж</option>
        <option value="corner">Тройной соединитель · Р.С.И. 2069</option>
        <option value="foot">Ножка и контргайка</option>
        <option value="hinge">Регулируемая петля · Blum</option>
        <option value="peg">Пегборд · глухие отверстия</option>
        <option value="pegmount">Пегборд · отверстие и штырь</option>
      </select>
    </label>
    <label class="form-label" for="cw170-door" id="cw170-door-field">Фасад <output class="tabular-nums" id="cw170-opening" for="cw170-door">Закрыт</output>
      <input class="form-range" type="range" id="cw170-door" min="0" max="200" step="1" value="0">
    </label>
    <label class="form-label" for="cw170-yaw">Ракурс <output class="tabular-nums" id="cw170-bearing" for="cw170-yaw">−24°</output>
      <input class="form-range" type="range" id="cw170-yaw" min="-180" max="180" step="1" value="-24">
    </label>
  </div>
  <div class="viz-controls" id="cw170-right-controls">
    <label class="form-label" for="cw170-section" id="cw170-section-field">Дверца
      <select class="form-select" id="cw170-section">
        <option value="1770">Верхняя</option>
        <option value="1448">Средняя</option>
        <option value="1127">Нижняя</option>
      </select>
    </label>
    <button class="btn btn-primary" type="button" id="cw170-toggle">Открыть</button>
  </div>
  <div class="viz-controls" id="cw170-left-controls">
    <label class="form-label" for="cw170-left">Левая распашная дверь <output class="tabular-nums" id="cw170-left-angle" for="cw170-left">0°</output>
      <input class="form-range" type="range" id="cw170-left" min="0" max="170" step="1" value="0">
    </label>
    <button class="btn" type="button" id="cw170-left-toggle">Открыть левую дверь</button>
  </div>
  <div class="viz-controls" id="cw170-explode-controls" hidden>
    <label class="form-label" for="cw170-explode">Разнести детали
      <input class="form-range" type="range" id="cw170-explode" min="0" max="100" step="1" value="80">
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-label" for="cw170-zoom">Масштаб <output id="cw170-zoom-value" for="cw170-zoom">100%</output>
      <input class="form-range" type="range" id="cw170-zoom" min="100" max="600" step="10" value="100">
    </label>
    <button class="btn" type="button" aria-pressed="false" id="cw170-pan">Сдвигать</button>
    <label class="form-check" id="cw170-reveal-field">
      <input class="form-check-input" type="checkbox" id="cw170-reveal" checked>
      <span class="form-check-label">Подсветить крепления</span>
    </label>
    <label class="form-label" id="cw170-focus-field" for="cw170-focus">Крепления
      <select class="form-select" id="cw170-focus">
        <option value="panel">Крепления боковин</option>
        <option value="all">Все</option>
        <option value="frame">Каркас</option>
        <option value="hinge">Петли</option>
      </select>
    </label>
  </div>
  <div id="cw170-stage">
  <canvas id="cw170-canvas" role="img" aria-label="Алюминиевый шкаф с пегбордом слева. Три правых фасада поднимаются и сдвигаются вглубь."></canvas>
  <svg id="cw170-markers" aria-hidden="true"></svg>
  </div>
  <p class="text-small text-muted" id="cw170-caption" aria-live="polite">1000 × 1800 × 500 мм · вариант петли 170°, не выпуск для заказа</p>
  <div class="text-small" id="cw170-legend" hidden>1 · Фанера 18 мм　2 · OB-3030　3 · Винт М6 × 45　4 · Шайба　5 · Гайка-бочонок</div>
  <span id="cw170-color" class="sr-only" aria-hidden="true"></span>
</section>

  --cw170-guide:light-dark(rgb(87,133,147),rgb(126,172,185));

#cw170-legend[hidden] {display:none}

<script>
(async () => {
  const root = document.getElementById('cambusa-wide-hinge-170');
  const byId = key => root.querySelector('#cw170-' + key);
  const canvas = byId('canvas');
  const controls = {door:byId('door'), yaw:byId('yaw'), explode:byId('explode'), zoom:byId('zoom')};
  const modelChoice = byId('model'), panButton = byId('pan'), reveal = byId('reveal');
  const sectionChoice = byId('section'), toggle = byId('toggle');
  const leftInput = byId('left'), leftToggle = byId('left-toggle');
  const gl = canvas.getContext('webgl', {antialias:true, alpha:true, preserveDrawingBuffer:true});
  if (!gl) {
    byId('caption').textContent = 'Для вращения модели нужен WebGL. Доступны отдельные модели GLB.';
    for (const control of [...Object.values(controls),modelChoice,sectionChoice,toggle,leftInput,leftToggle,panButton,reveal]) control.disabled = true;
    return;
  }
  const packed=Uint8Array.from(atob(document.getElementById('cw170-data').textContent.trim()),
    character=>character.charCodeAt(0));
  const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const model=await new Response(stream).json();
  const program = gl.createProgram();
  function attach(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
    gl.attachShader(program, shader);
  }
  attach(gl.VERTEX_SHADER, `
    attribute vec3 position, normal;
    uniform vec2 scale;
    uniform mat3 transform;
    uniform vec3 shift;
    uniform vec3 right, up, forward, center, paint;
    varying vec3 color;
    void main() {
      vec3 p = transform * position + shift - center;
      vec3 n = transform * normal;
      gl_Position = vec4(dot(p,right)*scale.x,dot(p,up)*scale.y,-dot(p,forward)/2100.,1.);
      float shade = .63 + .43 * max(0.,dot(n,normalize(vec3(-.45,-.58,.72))));
      color = paint*shade;
    }
  `);
  attach(gl.FRAGMENT_SHADER, `
    precision mediump float;
    uniform float opacity;
    varying vec3 color;
    void main() {gl_FragColor=vec4(color,opacity);}
  `);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  gl.enable(gl.DEPTH_TEST);
  const uniforms = Object.fromEntries(
    ['scale','transform','shift','right','up','forward','center','paint','opacity']
      .map(name => [name,gl.getUniformLocation(program,name)])
  );
  const position = gl.getAttribLocation(program,'position');
  const normal = gl.getAttribLocation(program,'normal');
  gl.enableVertexAttribArray(position);
  gl.enableVertexAttribArray(normal);

  function prepare(part) {
    const bytes = string => Uint8Array.from(atob(string), value => value.charCodeAt(0));
    const raw = new Int16Array(bytes(part.v).buffer);
    const indices = new Uint16Array(bytes(part.f).buffer);
    if (part.fd) {let sum=0;for(let i=0;i<indices.length;i++){sum=(sum+indices[i])&65535;indices[i]=sum;}}
    const v = [], f = [];
    for (let i=0;i<raw.length;i+=3) v.push([raw[i]/16,raw[i+1]/16,raw[i+2]/16]);
    for (let i=0;i<indices.length;i+=3) f.push([indices[i],indices[i+1],indices[i+2]]);
    if (part.axes) {
      for (const vertex of v) {
        const [x,y,z]=vertex;
        for (let row=0;row<3;row++) {
          const k=row*3;
          vertex[row]=part.origin[row]+part.axes[k]*x+part.axes[k+1]*y+part.axes[k+2]*z;
        }
      }
    }
    part = {...part,v,f};
    const values = new Float32Array(part.f.length * 18);
    let offset = 0;
    for (const face of part.f) {
      const [a,b,c] = face.map(index => part.v[index]);
      const [x,y,z] = b.map((value,index) => value-a[index]);
      const [u,v,w] = c.map((value,index) => value-a[index]);
      const cross = [y*w-z*v,z*u-x*w,x*v-y*u];
      const length = Math.hypot(...cross) || 1;
      const unit = cross.map(value => value/length);
      for (const vertex of [a,b,c]) {
        values.set(vertex,offset);
        values.set(unit,offset+3);
        offset += 6;
      }
    }
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,values,gl.STATIC_DRAW);
    return {...part,buffer,count:part.f.length*3};
  }
  function expand(p) {
    if (p.ref !== undefined) p={...model.full[p.ref],...p};
    return p.geo ? {...model.geo[p.geo],...p} : p;
  }
  const views = Object.fromEntries(['full','mount','section','right','frame','corner','foot','hinge','peg','pegmount','axis-l','axis-r'].map(key => [key,model[key].map(p => prepare(expand(p)))]));
  const fasteners = {
    full: views.full.filter(part => part.hardware),
    right: views.right.filter(part => part.hardware),
    frame: views.frame.filter(part => part.hardware)
  };
  const state = {reveal:true,focus:'panel',view:'full',section:1770,door:0,left:170,yaw:-36,pitch:12,explode:0,zoom:100,panX:0,panY:0,pan:false};
  const rightDoors = {1127:0,1448:0,1770:0};
  let detailDoor = 0, animation = 0, animationTarget;
  function currentProgress() { return state.view === 'full' ? rightDoors[state.section] : detailDoor; }
  function setProgress(value) {
    state.door = value;
    if (state.view === 'full') rightDoors[state.section] = value;
    else detailDoor = value;
  }
  function stopAnimation() {
    cancelAnimationFrame(animation);
    animationTarget = undefined;
  }
  const captions = {
    'axis-l':'Разрез · ось Ø6, вылет 10 мм · хвостовик М5 × 7 · муфта заподлицо · монтажный зазор 0 мм',
    'axis-r':'Разрез · ось Ø6, вылет 15 мм · хвостовик М5 × 7 · муфта заподлицо · монтажный зазор 0 мм',
    full:'1000 × 1800 × 500 мм · петля 170°, часть деталей показана схемой',
    mount:'Фрагмент сплошной правой боковины · бочонок ФМС 91001201 · все детали на местах',
    section:'Разрез через винт и гайку · ось винта в 9 мм от поверхности · гайка в 20 мм от края',
    right:'Полки глубиной 404 мм · передняя кромка утоплена на 0,5 мм · по 4 опорных штифта Ø6 мм',
