<section id="cambusa-v31-direct-axes">
  <h2>Cambusa v31 · оси без пластин</h2>
  <div class="viz-controls">
    <label class="form-label" for="c31-model">Вид
      <select class="form-select" id="c31-model">
        <option value="full">Шкаф целиком</option>
        <option value="axis-l">Ось слева · разрез крепления</option>
        <option value="axis-r">Ось справа · разрез крепления</option>
        <option value="section">Крепление 18 мм · разрез</option>
        <option value="mount">Крепление 18 мм · целиком</option>
        <option value="right">Правые полки · в каркасе</option>
        <option value="frame">Весь каркас и крепёж</option>
        <option value="corner">Тройной соединитель · Р.С.И. 2069</option>
        <option value="foot">Ножка и контргайка</option>
        <option value="hinge">Регулируемая петля · Blum</option>
        <option value="peg">Пегборд · глухие отверстия</option>
        <option value="pegmount">Пегборд · отверстие и штырь</option>
      </select>
    </label>
    <label class="form-label" for="c31-door" id="c31-door-field">Фасад <output class="tabular-nums" id="c31-opening" for="c31-door">Закрыт</output>
      <input class="form-range" type="range" id="c31-door" min="0" max="200" step="1" value="0">
    </label>
    <label class="form-label" for="c31-yaw">Ракурс <output class="tabular-nums" id="c31-bearing" for="c31-yaw">−24°</output>
      <input class="form-range" type="range" id="c31-yaw" min="-180" max="180" step="1" value="-24">
    </label>
  </div>
  <div class="viz-controls" id="c31-right-controls">
    <label class="form-label" for="c31-section" id="c31-section-field">Дверца
      <select class="form-select" id="c31-section">
        <option value="1770">Верхняя</option>
        <option value="1448">Средняя</option>
        <option value="1127">Нижняя</option>
      </select>
    </label>
    <button class="btn btn-primary" type="button" id="c31-toggle">Открыть</button>
  </div>
  <div class="viz-controls" id="c31-left-controls">
    <label class="form-label" for="c31-left">Левая распашная дверь <output class="tabular-nums" id="c31-left-angle" for="c31-left">0°</output>
      <input class="form-range" type="range" id="c31-left" min="0" max="110" step="1" value="0">
    </label>
    <button class="btn" type="button" id="c31-left-toggle">Открыть левую дверь</button>
  </div>
  <div class="viz-controls" id="c31-explode-controls" hidden>
    <label class="form-label" for="c31-explode">Разнести детали
      <input class="form-range" type="range" id="c31-explode" min="0" max="100" step="1" value="80">
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-label" for="c31-zoom">Масштаб <output id="c31-zoom-value" for="c31-zoom">100%</output>
      <input class="form-range" type="range" id="c31-zoom" min="100" max="600" step="10" value="100">
    </label>
    <button class="btn" type="button" aria-pressed="false" id="c31-pan">Сдвигать</button>
    <label class="form-check" id="c31-reveal-field">
      <input class="form-check-input" type="checkbox" id="c31-reveal" checked>
      <span class="form-check-label">Подсветить крепления</span>
    </label>
    <label class="form-label" id="c31-focus-field" for="c31-focus">Крепления
      <select class="form-select" id="c31-focus">
        <option value="panel">Боковины 18 мм</option>
        <option value="all">Все</option>
        <option value="frame">Каркас</option>
        <option value="hinge">Петли</option>
      </select>
    </label>
  </div>
  <div id="c31-stage">
  <canvas id="c31-canvas" role="img" aria-label="Алюминиевый шкаф с пегбордом слева. Три правых фасада поднимаются и сдвигаются вглубь."></canvas>
  <svg id="c31-markers" aria-hidden="true"></svg>
  </div>
  <p class="text-small text-muted" id="c31-caption" aria-live="polite">1000 × 1800 × 500 мм · три секции справа</p>
  <div class="text-small" id="c31-legend" hidden>1 · Фанера 18 мм　2 · OB-3030　3 · Винт М6 × 45　4 · Шайба　5 · Гайка-бочонок</div>
  <span id="c31-color" class="sr-only" aria-hidden="true"></span>
</section>
<style>
#cambusa-v31-direct-axes {
  display:grid;gap:calc(var(--font-size-base) * .5);color-scheme:light dark;
  --c31-angle:light-dark(rgb(37,128,137),rgb(91,181,185));
  --c31-fastener:light-dark(rgb(175,127,42),rgb(222,175,76));
  --c31-panel8:light-dark(rgb(149,101,72),rgb(165,120,89));
  --c31-wood:light-dark(rgb(129,91,64),rgb(152,109,80));
  --c31-door:light-dark(rgb(118,82,56),rgb(145,101,71));
  --c31-panel6:light-dark(rgb(153,111,79),rgb(175,128,96));
  --c31-frame:light-dark(rgb(50,60,64),rgb(99,110,114));
  --c31-glass:light-dark(rgb(109,184,198),rgb(150,216,226));
  --c31-pin:light-dark(rgb(209,148,42),rgb(237,181,69));
  --c31-guide:light-dark(rgb(87,133,147),rgb(126,172,185));
  --c31-handle:light-dark(rgb(183,191,195),rgb(205,213,218));
  --c31-book:light-dark(rgb(136,156,143),rgb(151,180,162));
  --c31-frameprop:light-dark(rgb(85,102,104),rgb(120,139,141));
  --c31-mat:light-dark(rgb(210,197,172),rgb(192,177,151));
}
#c31-canvas {display:block;width:100%;height:clamp(330px,64vw,510px);touch-action:pan-y;cursor:grab}
#c31-canvas:active {cursor:grabbing}
#c31-stage {position:relative}
#c31-markers {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
#c31-markers circle {fill:var(--background);stroke:var(--orange);stroke-width:2}
#c31-markers text {fill:var(--foreground);text-anchor:middle;dominant-baseline:central}
#c31-focus-field[hidden] {display:none}
#c31-legend[hidden] {display:none}
#c31-section-field[hidden], #c31-left-controls[hidden], #c31-door-field[hidden], #c31-right-controls[hidden], #c31-explode-controls[hidden], #c31-reveal-field[hidden] {display:none}
</style>

<script>
(async () => {
  const root = document.getElementById('cambusa-v31-direct-axes');
  const byId = key => root.querySelector('#c31-' + key);
  const canvas = byId('canvas');
  const controls = {door:byId('door'), yaw:byId('yaw'), explode:byId('explode'), zoom:byId('zoom')};
  const modelChoice = byId('model'), panButton = byId('pan'), reveal = byId('reveal');
  const sectionChoice = byId('section'), toggle = byId('toggle');
  const leftInput = byId('left'), leftToggle = byId('left-toggle');
  const gl = canvas.getContext('webgl', {antialias:true, alpha:true, preserveDrawingBuffer:true});
  if (!gl) {
    byId('caption').textContent = 'Для вращения модели нужен WebGL. Доступны отдельные модели GLB.';
    for (const control of [...Object.values(controls),modelChoice,sectionChoice,toggle,leftInput,leftToggle,panButton,reveal]) control.disabled = true;
    return;
  }
  const packed=Uint8Array.from(atob(document.getElementById('c31-data').textContent.trim()),
    character=>character.charCodeAt(0));
  const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const model=await new Response(stream).json();
  const program = gl.createProgram();
  function attach(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
    gl.attachShader(program, shader);
  }
  attach(gl.VERTEX_SHADER, `
    attribute vec3 position, normal;
    uniform vec2 scale;
    uniform mat3 transform;
    uniform vec3 shift;
    uniform vec3 right, up, forward, center, paint;
    varying vec3 color;
    void main() {
      vec3 p = transform * position + shift - center;
