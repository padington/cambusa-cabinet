<section id="cambusa-v33-independent-hinge">
  <h2>Cambusa · петля 170° · независимый CAD</h2>
  <div class="viz-controls">
    <label class="form-label" for="c33h-model">Вид
      <select class="form-select" id="c33h-model">
        <option value="full">Шкаф целиком</option>
        <option value="frame">Весь каркас и крепёж</option>
        <option value="hinge">Регулируемая петля · Blum</option>
        <option value="doorwood">Дверь · выборки с тыла</option>
        <option value="peg">Пегборд · глухие отверстия</option>
      </select>
    </label>
    <label class="form-label" for="c33h-door" id="c33h-door-field">Фасад <output class="tabular-nums" id="c33h-opening" for="c33h-door">Закрыт</output>
      <input class="form-range" type="range" id="c33h-door" min="0" max="200" step="1" value="0">
    </label>
    <label class="form-label" for="c33h-yaw">Ракурс <output class="tabular-nums" id="c33h-bearing" for="c33h-yaw">−24°</output>
      <input class="form-range" type="range" id="c33h-yaw" min="-180" max="180" step="1" value="-24">
    </label>
  </div>
  <div class="viz-controls" id="c33h-right-controls">
    <label class="form-label" for="c33h-section" id="c33h-section-field">Дверца
      <select class="form-select" id="c33h-section">
        <option value="1770">Верхняя</option>
        <option value="1448">Средняя</option>
        <option value="1127">Нижняя</option>
      </select>
    </label>
    <button class="btn btn-primary" type="button" id="c33h-toggle">Открыть</button>
  </div>
  <div class="viz-controls" id="c33h-left-controls">
    <label class="form-label" for="c33h-left">Левая распашная дверь <output class="tabular-nums" id="c33h-left-angle" for="c33h-left">0°</output>
      <input class="form-range" type="range" id="c33h-left" min="0" max="170" step="1" value="0">
    </label>
    <button class="btn" type="button" id="c33h-left-toggle">Открыть левую дверь</button>
  </div>
  <div class="viz-controls" id="c33h-explode-controls" hidden>
    <label class="form-label" for="c33h-explode">Разнести детали
      <input class="form-range" type="range" id="c33h-explode" min="0" max="100" step="1" value="80">
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-label" for="c33h-zoom">Масштаб <output id="c33h-zoom-value" for="c33h-zoom">100%</output>
      <input class="form-range" type="range" id="c33h-zoom" min="100" max="600" step="10" value="100">
    </label>
    <button class="btn" type="button" aria-pressed="false" id="c33h-pan">Сдвигать</button>
    <label class="form-check" id="c33h-reveal-field">
      <input class="form-check-input" type="checkbox" id="c33h-reveal" checked>
      <span class="form-check-label">Подсветить крепления</span>
    </label>
    <label class="form-label" id="c33h-focus-field" for="c33h-focus">Крепления
      <select class="form-select" id="c33h-focus">
        <option value="panel">Крепления боковин</option>
        <option value="all">Все</option>
        <option value="frame">Каркас</option>
        <option value="hinge">Петли</option>
      </select>
    </label>
  </div>
  <div id="c33h-stage">
  <canvas id="c33h-canvas" role="img" aria-label="Алюминиевый шкаф с пегбордом слева. Три правых фасада поднимаются и сдвигаются вглубь."></canvas>
  <svg id="c33h-markers" aria-hidden="true"></svg>
  </div>
  <p class="text-small text-muted" id="c33h-caption" aria-live="polite">1000 × 1800 × 500 мм · узел на реальной петле 170°</p>
  <div class="text-small" id="c33h-legend" hidden>1 · Фанера 18 мм　2 · OB-3030　3 · Винт М6 × 45　4 · Шайба　5 · Гайка-бочонок</div>
  <span id="c33h-color" class="sr-only" aria-hidden="true"></span>
</section>

  --c33h-glass:light-dark(rgb(109,184,198),rgb(150,216,226));

}

#c33h-markers text {fill:var(--foreground);text-anchor:middle;dominant-baseline:central}

#c33h-legend[hidden] {display:none}

</style>

  const root = document.getElementById('cambusa-v33-independent-hinge');
  const byId = key => root.querySelector('#c33h-' + key);
  const canvas = byId('canvas');
  const controls = {door:byId('door'), yaw:byId('yaw'), explode:byId('explode'), zoom:byId('zoom')};
  const modelChoice = byId('model'), panButton = byId('pan'), reveal = byId('reveal');
  const sectionChoice = byId('section'), toggle = byId('toggle');
  const leftInput = byId('left'), leftToggle = byId('left-toggle');
  const gl = canvas.getContext('webgl', {antialias:true, alpha:true, preserveDrawingBuffer:true});
  if (!gl) {
    byId('caption').textContent = 'Для вращения модели нужен WebGL. Доступны отдельные модели GLB.';
    for (const control of [...Object.values(controls),modelChoice,sectionChoice,toggle,leftInput,leftToggle,panButton,reveal]) control.disabled = true;
    return;
  }
  const packed=Uint8Array.from(atob(document.getElementById('c33h-data').textContent.trim()),
    character=>character.charCodeAt(0));

  const model=await new Response(stream).json();
  const program = gl.createProgram();

    gl.compileShader(shader);

    gl.attachShader(program, shader);

  attach(gl.VERTEX_SHADER, `

    uniform vec2 scale;
    uniform mat3 transform;
    uniform vec3 shift;
    uniform vec3 right, up, forward, center, paint;
    varying vec3 color;
    void main() {

      vec3 n = transform * normal;
      gl_Position = vec4(dot(p,right)*scale.x,dot(p,up)*scale.y,-dot(p,forward)/2100.,1.);

    }

    void main() {gl_FragColor=vec4(color,opacity);}

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));

  gl.enable(gl.DEPTH_TEST);
  const uniforms = Object.fromEntries(
    ['scale','transform','shift','right','up','forward','center','paint','opacity']
      .map(name => [name,gl.getUniformLocation(program,name)])

  const position = gl.getAttribLocation(program,'position');
  const normal = gl.getAttribLocation(program,'normal');

  gl.enableVertexAttribArray(normal);

  function prepare(part) {

    const indices = new Uint16Array(bytes(part.f).buffer);
    if (part.fd) {let sum=0;for(let i=0;i<indices.length;i++){sum=(sum+indices[i])&65535;indices[i]=sum;}}

    for (let i=0;i<raw.length;i+=3) v.push([raw[i]/16,raw[i+1]/16,raw[i+2]/16]);
    for (let i=0;i<indices.length;i+=3) f.push([indices[i],indices[i+1],indices[i+2]]);

      for (const vertex of v) {
        const [x,y,z]=vertex;
        for (let row=0;row<3;row++) {
          const k=row*3;
          vertex[row]=part.origin[row]+part.axes[k]*x+part.axes[k+1]*y+part.axes[k+2]*z;
        }
      }
    }
    part = {...part,v,f};
    const values = new Float32Array(part.f.length * 18);
    let offset = 0;
    for (const face of part.f) {
      const [a,b,c] = face.map(index => part.v[index]);
      const [x,y,z] = b.map((value,index) => value-a[index]);
      const [u,v,w] = c.map((value,index) => value-a[index]);
      const cross = [y*w-z*v,z*u-x*w,x*v-y*u];
      const length = Math.hypot(...cross) || 1;
      const unit = cross.map(value => value/length);
      for (const vertex of [a,b,c]) {
        values.set(vertex,offset);
        values.set(unit,offset+3);
        offset += 6;
      }

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,values,gl.STATIC_DRAW);
    let creaseBuffer, creaseCount = 0;
    if (part.m === 'door') {
      const edges = new Map();
      for (const face of part.f) {
        const [a,b,c] = face.map(i => part.v[i]);
        const q=b.map((x,i)=>x-a[i]), r=c.map((x,i)=>x-a[i]);
        const n=[q[1]*r[2]-q[2]*r[1],q[2]*r[0]-q[0]*r[2],q[0]*r[1]-q[1]*r[0]];

        for (let i=0;i<3;i++) {
          const x=face[i],y=face[(i+1)%3],key=Math.min(x,y)+':'+Math.max(x,y);
          if (!edges.has(key)) edges.set(key,{x,y,normals:[]});
          edges.get(key).normals.push(unit);
        }

      const lines=[];
      for (const {x,y,normals} of edges.values()) {
        if (normals.length===1 || normals.some(n=>n.reduce((sum,v,i)=>sum+v*normals[0][i],0)<.8)) {
          for (const i of [x,y]) lines.push(...part.v[i],0,0,0);
        }
      }
      creaseBuffer=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,creaseBuffer);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(lines),gl.STATIC_DRAW); creaseCount=lines.length/6;
    }

  }
  function expand(p) {
    if (p.ref !== undefined) p={...model.full[p.ref],...p};
    return p.geo ? {...model.geo[p.geo],...p} : p;
  }
  const views = Object.fromEntries(['full','mount','section','right','frame','corner','foot','hinge','peg','pegmount','axis-l','axis-r','doorwood'].map(key => [key,model[key].map(p => prepare(expand(p)))]));
  const fasteners = {
    full: views.full.filter(part => part.hardware),
    right: views.right.filter(part => part.hardware),
    frame: views.frame.filter(part => part.hardware)
  };
  const state = {reveal:true,focus:'panel',view:'hinge',section:1770,door:0,left:170,yaw:135,pitch:12,explode:0,zoom:100,panX:0,panY:0,pan:false};
  const rightDoors = {1127:0,1448:0,1770:0};
  let detailDoor = 0, animation = 0, animationTarget;
  function currentProgress() { return state.view === 'full' ? rightDoors[state.section] : detailDoor; }
  function setProgress(value) {
    state.door = value;
    if (state.view === 'full') rightDoors[state.section] = value;
    else detailDoor = value;
  }
  function stopAnimation() {
    cancelAnimationFrame(animation);
    animationTarget = undefined;
  }
  const captions = {
    doorwood:'Тыльная сторона · 3 чашки Ø35,2 × 11,2 · 3 выборки 11 × 28 × 6 мм · R3',
    'axis-l':'Разрез · ось Ø6, вылет 10 мм · хвостовик М5 × 7 · муфта заподлицо · монтажный зазор 0 мм',
    'axis-r':'Разрез · ось Ø6, вылет 15 мм · хвостовик М5 × 7 · муфта заподлицо · монтажный зазор 0 мм',
    full:'1000 × 1800 × 500 мм · петля 170°, внешний заводской CAD петли и планки',
    mount:'Фрагмент сплошной правой боковины · бочонок ФМС 91001201 · все детали на местах',
    section:'Разрез через винт и гайку · ось винта в 9 мм от поверхности · гайка в 20 мм от края',
    right:'Полки глубиной 404 мм · передняя кромка утоплена на 0,5 мм · по 4 опорных штифта Ø6 мм',
    frame:'14 × 5212 · 2 × 5211 · 4 × 2069 · 4 регулируемые ножки',
    corner:'Р.С.И. 2069 по STEP · 3 винта М8 × 25 и 3 заглушки на каждый угол',
    foot:'Опора D49M8H30 по STEP · М8 · контргайка · зацепление резьбы 20 мм',
    hinge:'Blum 71T6650 + 175H7190 · 170° · чашка Ø35,2 × 11,2 · выборки с тыла двери',
    peg:'Ø12 мм · шаг 50 мм · 152 глухих отверстия · глубина 16 мм · сзади 8 мм фанеры',
    pegmount:'Разрез глухого отверстия Ø12 × 16 мм · сзади 8 мм фанеры · пример штыря Ø11,8 мм'
  };
  const palette = {};
  const radians = Math.PI/180;
  const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const clamp = (v,min,max) => Math.max(min,Math.min(max,v));
  function hingeTransform(kind,degrees) {
    const p=model.widePoints,O=model.wideOffset;
    const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
    const rot=(a,v)=>[Math.cos(a)*v[0]-Math.sin(a)*v[1],Math.sin(a)*v[0]+Math.cos(a)*v[1]];
    const cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
    const ang=(a,b)=>Math.atan2(cross(a,b),a[0]*b[0]+a[1]*b[1]);
    const branch=(a,b,c)=>Math.sign(cross(sub(b,a),sub(c,a)));

    }
    const length=(a,b)=>Math.hypot(...sub(p[a],p[b]));

      const a2=ang(sub(p.C,p.B),sub(C,B)),a3=ang(sub(p.C,p.Q),sub(C,p.Q));
      const D=add(B,rot(a2,sub(p.D,p.B))),E=add(p.Q,rot(a3,sub(p.E,p.Q)));

    }
    let lo=0,hi=125*radians;
    for(let i=0;i<45;i++){

    }
    const pose=state((lo+hi)/2),body=Number(kind.slice(4));
    const key={1:'P',2:'B',3:'Q',4:'E',5:'D'}[body];
    if(!key)return {matrix:[1,0,0,0,1,0,0,0,1],shift:[0,0,0]};
    const world=q=>[O[0]-q[0],O[1]+q[1]],a=world(p[key]),b=world(pose.points[key]);
    const theta=-pose.angles[body],ct=Math.cos(theta),st=Math.sin(theta);
    return {matrix:[ct,st,0,-st,ct,0,0,0,1],shift:[b[0]-ct*a[0]+st*a[1],b[1]-st*a[0]-ct*a[1],0]};
  }
  let drag, scheduled = false;
  function theme() {
    const probe = byId('color');
    for (const key of new Set(Object.values(views).flat().map(part => part.m))) {
      probe.style.color = 'var(--c33h-' + key + ')';
      const rgb = getComputedStyle(probe).color.match(/[\d.]+/g);
      palette[key] = rgb.slice(0,3).map(value => Number(value)/255);
    }
    probe.style.color='var(--foreground)';
    palette.outline=getComputedStyle(probe).color.match(/[\d.]+/g).slice(0,3).map(x=>Number(x)/255);
    requestDraw();
  }
  function draw() {
    scheduled = false;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    const density = Math.min(devicePixelRatio || 1,2);
    if (canvas.width !== Math.round(w*density) || canvas.height !== Math.round(h*density)) {
      canvas.width = Math.round(w*density);
      canvas.height = Math.round(h*density);
    }
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const angle = state.yaw*radians, pitch = state.pitch*radians;
    const s = Math.sin(angle), c = Math.cos(angle), sp = Math.sin(pitch), cp = Math.cos(pitch);
    const right = [c,s,0], up = [-s*sp,c*sp,cp], forward = [s*cp,-c*cp,sp];
    const progressAt = top => state.view === 'full' ? rightDoors[top] : detailDoor;
    const parts = views[state.view].filter(part => part.display === null || progressAt(part.display) === 0);
    const glass = parts.find(part => part.m === 'glass');
    const identity = [1,0,0,0,1,0,0,0,1];
    const positions = new Map();
    const leftAngle = -state.left*radians;
    const cl=Math.cos(leftAngle), sl=Math.sin(leftAngle);
    const [ax,ay]=model.leftAxis;
    for (const part of parts) {
      if (part.motion) {positions.set(part,hingeTransform(part.motion,state.left));continue;}
      if (part.left) {
        positions.set(part,{
          matrix:[cl,sl,0,-sl,cl,0,0,0,1],
          shift:[ax-cl*ax+sl*ay,ay-sl*ax-cl*ay,0]
        });
        continue;
      }
      if (part.top === null) {
        positions.set(part,{matrix:identity,shift:part.delta?.map(v => v*state.explode/100) ?? [0,0,0]});
        continue;
      }
      const p = progressAt(part.top)/100;
      const theta = (model.tilt + (90-model.tilt)*Math.min(p,1))*radians;
      const travel = model.slotStart + ((model.slotEnds[part.top] ?? model.slotEnd)-model.slotStart)*Math.max(p-1,0);
      const ca = Math.cos(theta), sa = Math.sin(theta);
      const shift = [0,model.pivotY+sa*travel,part.top-model.pivotBelow+ca*travel];
      positions.set(part,{matrix:[1,0,0,0,ca,-sa,0,sa,ca],shift,ca,sa});
    }
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for (const part of parts) {
      const {shift:[dx,dy,dz],matrix:m} = positions.get(part);
      for (const point of part.v) {
        const [x,y,z] = point;
        const p=[m[0]*x+m[3]*y+m[6]*z+dx,m[1]*x+m[4]*y+m[7]*z+dy,m[2]*x+m[5]*y+m[8]*z+dz];
        const u=dot(p,right), v=dot(p,up);
        minX=Math.min(minX,u); maxX=Math.max(maxX,u);
        minY=Math.min(minY,v); maxY=Math.max(maxY,v);
      }
    }
    const midX=(minX+maxX)/2, midY=(minY+maxY)/2;
    const baseScale=Math.min((w-20)/(maxX-minX),(h-18)/(maxY-minY));
    const scale=baseScale*state.zoom/100;
    const centerX=midX-state.panX*w/baseScale, centerY=midY+state.panY*h/baseScale;
    gl.uniform3fv(uniforms.right,right);
    gl.uniform3fv(uniforms.up,up);
    gl.uniform3fv(uniforms.forward,forward);
    gl.uniform3fv(uniforms.center,right.map((v,i) => v*centerX+up[i]*centerY));
    gl.uniform2f(uniforms.scale,2*scale/w,2*scale/h);
    function paint(part, opacity) {
      gl.bindBuffer(gl.ARRAY_BUFFER,part.buffer);
      gl.vertexAttribPointer(position,3,gl.FLOAT,false,24,0);
      gl.vertexAttribPointer(normal,3,gl.FLOAT,false,24,12);
      const {matrix,shift} = positions.get(part);
      gl.uniformMatrix3fv(uniforms.transform,false,matrix);
      gl.uniform3fv(uniforms.shift,shift);
      gl.uniform3fv(uniforms.paint,palette[part.m]);
      gl.uniform1f(uniforms.opacity,opacity);
      gl.drawArrays(gl.TRIANGLES,0,part.count);
    }
    if (state.view==='doorwood') {gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1,1);}

    gl.disable(gl.POLYGON_OFFSET_FILL);

      gl.depthFunc(gl.LEQUAL);

        paint(part,1);
        gl.bindBuffer(gl.ARRAY_BUFFER,part.creaseBuffer);
        gl.vertexAttribPointer(position,3,gl.FLOAT,false,24,0);
        gl.vertexAttribPointer(normal,3,gl.FLOAT,false,24,12);
        gl.uniform3fv(uniforms.paint,palette.outline.map(x=>x/.42));
        gl.drawArrays(gl.LINES,0,part.creaseCount);
      }
      gl.depthFunc(gl.LESS);
    }
    gl.enable(gl.BLEND);
    gl.enable(gl.CULL_FACE);
    gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    if (glass) paint(glass,.27);
    gl.depthMask(true);
    gl.disable(gl.CULL_FACE);
    gl.disable(gl.BLEND);

      p=>state.focus==='all'||p.hardware===state.focus) : undefined;
    if (visibleFasteners?.length) {
      gl.clear(gl.DEPTH_BUFFER_BIT);
      for (const part of visibleFasteners) {
        if (!positions.has(part)) positions.set(part,{matrix:identity,shift:[0,0,0]});
        paint(part,1);
      }
    }
    const markers=byId('markers');markers.replaceChildren();markers.setAttribute('viewBox',`0 0 ${w} ${h}`);
    const labels=model.detailLabels?.[state.view]??[];
    for (const mark of labels) {
      const point=mark.point.map((v,i)=>v+mark.delta[i]*state.explode/100);
      const x=w/2+(dot(point,right)-centerX)*scale,y=h/2-(dot(point,up)-centerY)*scale;
      const ns='http://www.w3.org/2000/svg',circle=document.createElementNS(ns,'circle'),text=document.createElementNS(ns,'text');
      circle.setAttribute('cx',x);circle.setAttribute('cy',y);circle.setAttribute('r',11);
      text.setAttribute('x',x);text.setAttribute('y',y);text.setAttribute('class','text-small');text.textContent=mark.text;
      markers.append(circle,text);
    }
    if (state.view==='full' && state.reveal && ['all','panel'].includes(state.focus)) {
      const ns='http://www.w3.org/2000/svg';
      for (const mark of model.mounts) {
        const x=w/2+(dot(mark.point,right)-centerX)*scale;
        const y=h/2-(dot(mark.point,up)-centerY)*scale;
        const circle=document.createElementNS(ns,'circle');circle.setAttribute('cx',x);circle.setAttribute('cy',y);circle.setAttribute('r',13);
        const text=document.createElementNS(ns,'text');text.setAttribute('x',x);text.setAttribute('y',y);text.setAttribute('class','text-small');text.textContent=mark.id;
        markers.append(circle,text);
      }
    }
  }
  function requestDraw() {
    if (scheduled) return;

    requestAnimationFrame(draw);
  }
  function sync() {
    modelChoice.value = state.view;
    sectionChoice.value = state.section;
    byId('section-field').hidden = state.view !== 'full';
    byId('left-controls').hidden = !['full','hinge'].includes(state.view);
    const detail = state.view !== 'full';
    byId('door-field').hidden = detail;
    byId('right-controls').hidden = detail;
    byId('explode-controls').hidden = !['mount','section','pegmount'].includes(state.view);
    controls.explode.value = state.explode;
    controls.zoom.value = state.zoom;
    byId('zoom-value').textContent = state.zoom+'%';
    panButton.setAttribute('aria-pressed',String(state.pan));
    leftInput.value = state.left;
    byId('left-angle').textContent = Math.round(state.left)+'°';
    leftToggle.textContent = state.left>0 ? 'Закрыть левую дверь' : 'Открыть левую дверь';
    toggle.textContent = (animationTarget ?? state.door) > 0 ? 'Закрыть' : 'Открыть';
    byId('reveal-field').hidden = !fasteners[state.view];
    byId('focus-field').hidden = !fasteners[state.view];
    byId('legend').hidden = !['mount','section'].includes(state.view);
    byId('focus').value=state.focus;
    reveal.checked = state.reveal;
    byId('caption').textContent = captions[state.view] +
      (state.reveal && fasteners[state.view] ? ' · крепёж виден сквозь панели' : '');
    controls.door.value = state.door;
    controls.yaw.value = state.yaw;
    const p = state.door;
    const status = p===0 ? 'закрыт' : p<100 ? 'поднимается' : p===100 ? 'горизонтально' : p<200 ? 'задвигается' : 'под крышей';
    byId('opening').textContent = status;
    controls.door.setAttribute('aria-valuetext',status);
    byId('bearing').textContent = Math.round(state.yaw).toString().replace('-','−') + '°';
    requestDraw();
  }
  function restore(saved) {
    if (saved?.modelContent?.version === 'cambusa-v33-independent-hinge') {
      const {door_progress:door,view} = saved.modelContent;
      if (Object.hasOwn(views,view)) state.view = view;
      const stored = saved.privateContent;
      state.pan = stored?.pan === true;
      state.reveal = stored?.reveal !== false;
      if (['all','panel','frame','hinge'].includes(saved.modelContent.focus)) state.focus=saved.modelContent.focus;
      if (Number.isFinite(saved.modelContent.left_degrees)) state.left=clamp(saved.modelContent.left_degrees,0,170);
      if (Object.hasOwn(rightDoors,stored?.section)) state.section = stored.section;
      for (const top of Object.keys(rightDoors)) {
        const value = stored?.rightDoors?.[top];
        if (Number.isFinite(value)) rightDoors[top] = clamp(value,0,200);
      }
      if (Number.isFinite(stored?.detailDoor)) detailDoor = clamp(stored.detailDoor,0,200);
      if (!stored?.rightDoors && Number.isFinite(door)) setProgress(clamp(door,0,200));
      state.door = currentProgress();
      for (const [key,min,max] of [['yaw',-180,180],['pitch',-20,75],['explode',0,100],['zoom',100,600],['panX',-2,2],['panY',-2,2]]) {
        const value = saved.privateContent?.[key];
        if (Number.isFinite(value)) state[key] = clamp(value,min,max);
      }
    }
    sync();
  }
  function save() {
    window.openai?.setWidgetState?.({
      modelContent:{version:'cambusa-v33-independent-hinge',view:state.view,focus:state.focus,door_progress:state.door,left_degrees:state.left},
      privateContent:{yaw:state.yaw,pitch:state.pitch,section:state.section,rightDoors,detailDoor,explode:state.explode,zoom:state.zoom,panX:state.panX,panY:state.panY,pan:state.pan,reveal:state.reveal}
    })?.catch(() => {});
  }
  for (const [key,input] of Object.entries(controls)) {
    input.addEventListener('input',() => {
      if (key==='door') {
        stopAnimation();
        setProgress(Number(input.value));
      } else {
        state[key]=Number(input.value);
        if (key==='zoom' && state.zoom===100) state.panX=state.panY=0;
      }
      sync();
    });
    input.addEventListener('change',save);
  }
  reveal.addEventListener('change',() => {state.reveal=reveal.checked; sync(); save();});
  byId('focus').addEventListener('change',()=>{state.focus=byId('focus').value;sync();save();});
  panButton.addEventListener('click',() => {state.pan=!state.pan; sync(); save();});
  modelChoice.addEventListener('change',() => {
    stopAnimation();
    state.view=modelChoice.value;
    state.explode=0;
    if (state.view==='frame' && state.focus==='panel') state.focus='frame';
    state.zoom=100; state.panX=state.panY=0;
    state.door=currentProgress();
    const bearings = {'axis-l':[0,12],'axis-r':[0,12],full:[-36,12], mount:[-32,12], section:[-18,8], right:[51,18], frame:[-41,15], corner:[-51,19], foot:[-35,12], hinge:[135,12], peg:[-90,0],pegmount:[0,0],doorwood:[150,18]};
    [state.yaw,state.pitch]=bearings[state.view];
    sync();
    save();
  });
  sectionChoice.addEventListener('change',() => {
    stopAnimation();
    state.section=Number(sectionChoice.value);
    state.door=currentProgress();
    sync();
    save();
  });
  toggle.addEventListener('click',() => {
    const target=(animationTarget ?? state.door)>0 ? 0 : 200;
    stopAnimation();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setProgress(target); sync(); save(); return;
    }
    animationTarget=target;
    const from=state.door, start=performance.now();
    const duration=Math.max(180,1300*Math.abs(target-from)/200);
    function tick(now) {
      const fraction=Math.min(1,(now-start)/duration);
      setProgress(Math.round(from+(target-from)*fraction));
      if (fraction===1) {
        animationTarget=undefined;
        sync();
        save();
      } else {
        sync();
        animation=requestAnimationFrame(tick);
      }
    }
    sync();
    animation=requestAnimationFrame(tick);
  });
  leftInput.addEventListener('input',() => {state.left=Number(leftInput.value); sync();});
  leftInput.addEventListener('change',save);
  leftToggle.addEventListener('click',() => {state.left=state.left>0 ? 0 : 170; sync(); save();});
  canvas.addEventListener('pointerdown',event => {
    if (event.button !== 0) return;
    drag = {id:event.pointerId,x:event.clientX,y:event.clientY,yaw:state.yaw,pitch:state.pitch,pan:state.pan||event.shiftKey,panX:state.panX,panY:state.panY};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove',event => {
    if (drag?.id !== event.pointerId) return;
    if (drag.pan) {
      const zoom=state.zoom/100;
      state.panX=clamp(drag.panX+(event.clientX-drag.x)/(canvas.clientWidth*zoom),-2,2);
      state.panY=clamp(drag.panY+(event.clientY-drag.y)/(canvas.clientHeight*zoom),-2,2);
      sync();
      return;
    }
    state.yaw=((drag.yaw+(event.clientX-drag.x)*.55+540)%360)-180;
    state.pitch=clamp(drag.pitch+(event.clientY-drag.y)*.25,-20,75);
    sync();
  });
  canvas.addEventListener('lostpointercapture',() => {drag=undefined; save();});
  new ResizeObserver(requestDraw).observe(canvas);
  new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
  window.addEventListener('openai:set_globals',event => restore(event.detail?.globals?.widgetState));
  theme();
  restore(window.openai?.widgetState);
})();
</script>
