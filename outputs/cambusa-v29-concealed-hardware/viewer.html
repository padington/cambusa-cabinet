<section id="cambusa-v29-structural-checkpoint">
  <h2>Cambusa · крепления боковин 18 мм</h2>
  <div class="viz-controls">
    <label class="form-label" for="c29-model">Вид
      <select class="form-select" id="c29-model">
        <option value="full">Шкаф целиком</option>
        <option value="section">Крепление 18 мм · разрез</option>
        <option value="mount">Крепление 18 мм · целиком</option>
        <option value="right">Опоры правых полок</option>
        <option value="frame">Весь каркас и крепёж</option>
        <option value="corner">Тройной соединитель · Р.С.И. 2069</option>
        <option value="foot">Ножка и контргайка</option>
        <option value="hinge">Петля левой двери · Р.С.И. 3025</option>
        <option value="peg">Сетка пегборда</option>
      </select>
    </label>
    <label class="form-label" for="c29-door" id="c29-door-field">Фасад <output class="tabular-nums" id="c29-opening" for="c29-door">Закрыт</output>
      <input class="form-range" type="range" id="c29-door" min="0" max="200" step="1" value="0">
    </label>
    <label class="form-label" for="c29-yaw">Ракурс <output class="tabular-nums" id="c29-bearing" for="c29-yaw">−24°</output>
      <input class="form-range" type="range" id="c29-yaw" min="-180" max="180" step="1" value="-24">
    </label>
  </div>
  <div class="viz-controls" id="c29-right-controls">
    <label class="form-label" for="c29-section" id="c29-section-field">Дверца
      <select class="form-select" id="c29-section">
        <option value="1770">Верхняя</option>
        <option value="1448">Средняя</option>
        <option value="1127">Нижняя</option>
      </select>
    </label>
    <button class="btn btn-primary" type="button" id="c29-toggle">Открыть</button>
  </div>
  <div class="viz-controls" id="c29-left-controls">
    <label class="form-label" for="c29-left">Левая распашная дверь <output class="tabular-nums" id="c29-left-angle" for="c29-left">0°</output>
      <input class="form-range" type="range" id="c29-left" min="0" max="180" step="1" value="0">
    </label>
    <button class="btn" type="button" id="c29-left-toggle">Открыть левую дверь</button>
  </div>
  <div class="viz-controls" id="c29-explode-controls" hidden>
    <label class="form-label" for="c29-explode">Разнести детали
      <input class="form-range" type="range" id="c29-explode" min="0" max="100" step="1" value="80">
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-label" for="c29-zoom">Масштаб <output id="c29-zoom-value" for="c29-zoom">100%</output>
      <input class="form-range" type="range" id="c29-zoom" min="100" max="600" step="10" value="100">
    </label>
    <button class="btn" type="button" aria-pressed="false" id="c29-pan">Сдвигать</button>
    <label class="form-check" id="c29-reveal-field">
      <input class="form-check-input" type="checkbox" id="c29-reveal" checked>
      <span class="form-check-label">Подсветить крепления</span>
    </label>
    <label class="form-label" id="c29-focus-field" for="c29-focus">Крепления
      <select class="form-select" id="c29-focus">
        <option value="panel">Боковины 18 мм</option>
        <option value="all">Все</option>
        <option value="frame">Каркас</option>
        <option value="hinge">Петли</option>
      </select>
    </label>
  </div>
  <div id="c29-stage">
  <canvas id="c29-canvas" role="img" aria-label="Алюминиевый шкаф с пегбордом слева. Три правых фасада поднимаются и сдвигаются вглубь."></canvas>
  <svg id="c29-markers" aria-hidden="true"></svg>
  </div>
  <p class="text-small text-muted" id="c29-caption" aria-live="polite">1000 × 1800 × 500 мм · три секции справа</p>
  <span id="c29-color" class="sr-only" aria-hidden="true"></span>
</section>

  display:grid;gap:calc(var(--font-size-base) * .5);color-scheme:light dark;

  --c29-panel8:light-dark(rgb(149,101,72),rgb(165,120,89));
  --c29-wood:light-dark(rgb(129,91,64),rgb(152,109,80));
  --c29-door:light-dark(rgb(118,82,56),rgb(145,101,71));
  --c29-panel6:light-dark(rgb(153,111,79),rgb(175,128,96));
  --c29-frame:light-dark(rgb(50,60,64),rgb(99,110,114));
  --c29-glass:light-dark(rgb(109,184,198),rgb(150,216,226));
  --c29-pin:light-dark(rgb(209,148,42),rgb(237,181,69));
  --c29-guide:light-dark(rgb(87,133,147),rgb(126,172,185));
  --c29-handle:light-dark(rgb(183,191,195),rgb(205,213,218));
  --c29-book:light-dark(rgb(136,156,143),rgb(151,180,162));
  --c29-frameprop:light-dark(rgb(85,102,104),rgb(120,139,141));
  --c29-mat:light-dark(rgb(210,197,172),rgb(192,177,151));
}
#c29-canvas {display:block;width:100%;height:clamp(330px,64vw,510px);touch-action:pan-y;cursor:grab}
#c29-canvas:active {cursor:grabbing}
#c29-stage {position:relative}
#c29-markers {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
#c29-markers circle {fill:var(--background);stroke:var(--orange);stroke-width:2}
#c29-markers text {fill:var(--foreground);text-anchor:middle;dominant-baseline:central}
#c29-focus-field[hidden] {display:none}
#c29-section-field[hidden], #c29-left-controls[hidden], #c29-door-field[hidden], #c29-right-controls[hidden], #c29-explode-controls[hidden], #c29-reveal-field[hidden] {display:none}
</style>

<script>
(async () => {
  const root = document.getElementById('cambusa-v29-structural-checkpoint');
  const byId = key => root.querySelector('#c29-' + key);
  const canvas = byId('canvas');
  const controls = {door:byId('door'), yaw:byId('yaw'), explode:byId('explode'), zoom:byId('zoom')};
  const modelChoice = byId('model'), panButton = byId('pan'), reveal = byId('reveal');
  const sectionChoice = byId('section'), toggle = byId('toggle');
  const leftInput = byId('left'), leftToggle = byId('left-toggle');
  const gl = canvas.getContext('webgl', {antialias:true, alpha:true, preserveDrawingBuffer:true});
  if (!gl) {
    byId('caption').textContent = 'Для вращения модели нужен WebGL. Доступны отдельные модели GLB.';
    for (const control of [...Object.values(controls),modelChoice,sectionChoice,toggle,leftInput,leftToggle,panButton,reveal]) control.disabled = true;

    mount:'Фанера 18 мм · OB-3030 · М6 × 45 · гайка Ø10 × 13 · шайба',
    section:'Разрез по оси винта · гайка в 20 мм от края · винт по середине толщины: 9 мм',
    right:'Цельная боковина 18 мм · полки на четырёх штифтах Ø6 мм',
    frame:'14 × 5212 · 2 × 5211 · 4 × 2069 · 4 регулируемые ножки',
    corner:'Р.С.И. 2069 по STEP · 3 винта М8 × 25 и 3 заглушки на каждый угол',
    foot:'Опора D49M8H30 по STEP · М8 · контргайка · зацепление резьбы 20 мм',
    hinge:'Р.С.И. 3025 по STEP · слева паз стойки · справа фанера 18 мм',

})();
