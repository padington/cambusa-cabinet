<section id="cambusa-v30-review-fixes">
  <h2>Cambusa v30 · проверка исправлений</h2>
  <div class="viz-controls">
    <label class="form-label" for="c30-model">Вид
      <select class="form-select" id="c30-model">
        <option value="full">Шкаф целиком</option>
        <option value="section">Крепление 18 мм · разрез</option>
        <option value="mount">Крепление 18 мм · целиком</option>
        <option value="right">Правые полки · в каркасе</option>
        <option value="frame">Весь каркас и крепёж</option>
        <option value="corner">Тройной соединитель · Р.С.И. 2069</option>
        <option value="foot">Ножка и контргайка</option>
        <option value="hinge">Регулируемая петля · Blum</option>
        <option value="peg">Пегборд · глухие отверстия</option>
        <option value="pegmount">Пегборд · отверстие и штырь</option>
      </select>
    </label>
    <label class="form-label" for="c30-door" id="c30-door-field">Фасад <output class="tabular-nums" id="c30-opening" for="c30-door">Закрыт</output>
      <input class="form-range" type="range" id="c30-door" min="0" max="200" step="1" value="0">
    </label>
    <label class="form-label" for="c30-yaw">Ракурс <output class="tabular-nums" id="c30-bearing" for="c30-yaw">−24°</output>
      <input class="form-range" type="range" id="c30-yaw" min="-180" max="180" step="1" value="-24">
    </label>
  </div>
  <div class="viz-controls" id="c30-right-controls">
    <label class="form-label" for="c30-section" id="c30-section-field">Дверца
      <select class="form-select" id="c30-section">
        <option value="1770">Верхняя</option>
        <option value="1448">Средняя</option>
        <option value="1127">Нижняя</option>
      </select>
    </label>
    <button class="btn btn-primary" type="button" id="c30-toggle">Открыть</button>
  </div>
  <div class="viz-controls" id="c30-left-controls">
    <label class="form-label" for="c30-left">Левая распашная дверь <output class="tabular-nums" id="c30-left-angle" for="c30-left">0°</output>
      <input class="form-range" type="range" id="c30-left" min="0" max="110" step="1" value="0">
    </label>
    <button class="btn" type="button" id="c30-left-toggle">Открыть левую дверь</button>
  </div>
  <div class="viz-controls" id="c30-explode-controls" hidden>
    <label class="form-label" for="c30-explode">Разнести детали
      <input class="form-range" type="range" id="c30-explode" min="0" max="100" step="1" value="80">
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-label" for="c30-zoom">Масштаб <output id="c30-zoom-value" for="c30-zoom">100%</output>
      <input class="form-range" type="range" id="c30-zoom" min="100" max="600" step="10" value="100">
    </label>
    <button class="btn" type="button" aria-pressed="false" id="c30-pan">Сдвигать</button>
    <label class="form-check" id="c30-reveal-field">
      <input class="form-check-input" type="checkbox" id="c30-reveal" checked>
      <span class="form-check-label">Подсветить крепления</span>
    </label>
    <label class="form-label" id="c30-focus-field" for="c30-focus">Крепления
      <select class="form-select" id="c30-focus">
        <option value="panel">Боковины 18 мм</option>
        <option value="all">Все</option>
        <option value="frame">Каркас</option>
        <option value="hinge">Петли</option>
      </select>
    </label>
  </div>
  <div id="c30-stage">
  <canvas id="c30-canvas" role="img" aria-label="Алюминиевый шкаф с пегбордом слева. Три правых фасада поднимаются и сдвигаются вглубь."></canvas>
  <svg id="c30-markers" aria-hidden="true"></svg>
  </div>
  <p class="text-small text-muted" id="c30-caption" aria-live="polite">1000 × 1800 × 500 мм · три секции справа</p>
  <div class="text-small" id="c30-legend" hidden>1 · Фанера 18 мм　2 · OB-3030　3 · Винт М6 × 45　4 · Шайба　5 · Гайка-бочонок</div>
  <span id="c30-color" class="sr-only" aria-hidden="true"></span>
</section>

  display:grid;gap:calc(var(--font-size-base) * .5);color-scheme:light dark;

  --c30-fastener:light-dark(rgb(175,127,42),rgb(222,175,76));
  --c30-panel8:light-dark(rgb(149,101,72),rgb(165,120,89));
  --c30-wood:light-dark(rgb(129,91,64),rgb(152,109,80));
  --c30-door:light-dark(rgb(118,82,56),rgb(145,101,71));
  --c30-panel6:light-dark(rgb(153,111,79),rgb(175,128,96));
  --c30-frame:light-dark(rgb(50,60,64),rgb(99,110,114));
  --c30-glass:light-dark(rgb(109,184,198),rgb(150,216,226));
  --c30-pin:light-dark(rgb(209,148,42),rgb(237,181,69));
  --c30-guide:light-dark(rgb(87,133,147),rgb(126,172,185));
  --c30-handle:light-dark(rgb(183,191,195),rgb(205,213,218));
  --c30-book:light-dark(rgb(136,156,143),rgb(151,180,162));
  --c30-frameprop:light-dark(rgb(85,102,104),rgb(120,139,141));
  --c30-mat:light-dark(rgb(210,197,172),rgb(192,177,151));
}
#c30-canvas {display:block;width:100%;height:clamp(330px,64vw,510px);touch-action:pan-y;cursor:grab}
#c30-canvas:active {cursor:grabbing}
#c30-stage {position:relative}
#c30-markers {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
#c30-markers circle {fill:var(--background);stroke:var(--orange);stroke-width:2}
#c30-markers text {fill:var(--foreground);text-anchor:middle;dominant-baseline:central}
#c30-focus-field[hidden] {display:none}
#c30-legend[hidden] {display:none}
#c30-section-field[hidden], #c30-left-controls[hidden], #c30-door-field[hidden], #c30-right-controls[hidden], #c30-explode-controls[hidden], #c30-reveal-field[hidden] {display:none}
</style>

<script>
(async () => {

  const canvas = byId('canvas');
  const controls = {door:byId('door'), yaw:byId('yaw'), explode:byId('explode'), zoom:byId('zoom')};
  const modelChoice = byId('model'), panButton = byId('pan'), reveal = byId('reveal');
  const sectionChoice = byId('section'), toggle = byId('toggle');
  const leftInput = byId('left'), leftToggle = byId('left-toggle');

    for (const control of [...Object.values(controls),modelChoice,sectionChoice,toggle,leftInput,leftToggle,panButton,reveal]) control.disabled = true;
    return;
  }
  const packed=Uint8Array.from(atob(document.getElementById('c30-data').textContent.trim()),
    character=>character.charCodeAt(0));
  const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const model=await new Response(stream).json();
  const program = gl.createProgram();
  function attach(type, source) {

    uniform mat3 transform;
    uniform vec3 shift;
    uniform vec3 right, up, forward, center, paint;
    varying vec3 color;
    void main() {

      vec3 n = transform * normal;
      gl_Position = vec4(dot(p,right)*scale.x,dot(p,up)*scale.y,-dot(p,forward)/2100.,1.);

  function prepare(part) {

    if (part.fd) {let sum=0;for(let i=0;i<indices.length;i++){sum=(sum+indices[i])&65535;indices[i]=sum;}}
    const v = [], f = [];
    for (let i=0;i<raw.length;i+=3) v.push([raw[i]/16,raw[i+1]/16,raw[i+2]/16]);
    for (let i=0;i<indices.length;i+=3) f.push([indices[i],indices[i+1],indices[i+2]]);

        for (let row=0;row<3;row++) {

      const unit = cross.map(value => value/length);

  const fasteners = {

  const state = {reveal:true,focus:'panel',view:'full',section:1770,door:0,left:0,yaw:-36,pitch:12,explode:0,zoom:100,panX:0,panY:0,pan:false};
  const rightDoors = {1127:0,1448:0,1770:0};

  const captions = {

    right:'Полки глубиной 404 мм · передняя кромка утоплена на 0,5 мм · по 4 опорных штифта Ø6 мм',
    frame:'14 × 5212 · 2 × 5211 · 4 × 2069 · 4 регулируемые ножки',
    corner:'Р.С.И. 2069 по STEP · 3 винта М8 × 25 и 3 заглушки на каждый угол',
    foot:'Опора D49M8H30 по STEP · М8 · контргайка · зацепление резьбы 20 мм',
    hinge:'Blum 71B3750 + 175H3100 · проставка чашки 70T3507.21 · регулировка по трём направлениям',
    peg:'Ø12 мм · шаг 50 мм · 152 глухих отверстия · глубина 10 мм · сзади 8 мм фанеры',
    pegmount:'Разрез глухого отверстия Ø12 × 10 мм · сзади 8 мм фанеры · пример штыря Ø11,8 мм'
  };
  const palette = {};
  const radians = Math.PI/180;
  const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const clamp = (v,min,max) => Math.max(min,Math.min(max,v));
  function hingeTransform(kind,degrees) {
    const {fixed_p:P,fixed_q:Q,moving_b:B,moving_a:A,world_offset_xy:O}=model.linkage;
    const angle=degrees*radians,c=Math.cos(angle),s=Math.sin(angle);
    const d=[c*(A[0]-B[0])-s*(A[1]-B[1]),s*(A[0]-B[0])+c*(A[1]-B[1])];
    const span=[Q[0]-d[0]-P[0],Q[1]-d[1]-P[1]],dist=Math.hypot(...span);
    const u=span.map(v=>v/dist),r1=Math.hypot(B[0]-P[0],B[1]-P[1]),r2=Math.hypot(A[0]-Q[0],A[1]-Q[1]);

    byId('left-controls').hidden = !['full','hinge'].includes(state.view);
    const detail = state.view !== 'full';
    byId('door-field').hidden = detail;
    byId('right-controls').hidden = detail;
    byId('explode-controls').hidden = !['mount','section','pegmount'].includes(state.view);
    controls.explode.value = state.explode;
    controls.zoom.value = state.zoom;
    byId('zoom-value').textContent = state.zoom+'%';

    toggle.textContent = (animationTarget ?? state.door) > 0 ? 'Закрыть' : 'Открыть';
    byId('reveal-field').hidden = !fasteners[state.view];
    byId('focus-field').hidden = !fasteners[state.view];
    byId('legend').hidden = !['mount','section'].includes(state.view);
    byId('focus').value=state.focus;
    reveal.checked = state.reveal;
    byId('caption').textContent = captions[state.view] +

    controls.yaw.value = state.yaw;
    const p = state.door;
    const status = p===0 ? 'закрыт' : p<100 ? 'поднимается' : p===100 ? 'горизонтально' : p<200 ? 'задвигается' : 'под крышей';

      const stored = saved.privateContent;

      state.reveal = stored?.reveal !== false;

      if (Number.isFinite(saved.modelContent.left_degrees)) state.left=clamp(saved.modelContent.left_degrees,0,110);
