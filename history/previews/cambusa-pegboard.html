<script>
(()=>{

const canvas=root.querySelector('#mc-canvas'),ctx=canvas.getContext('2d');
const choice=root.querySelector('#mc-variant'),opened=root.querySelector('#mc-open'),rotation=root.querySelector('#mc-rotate'),accessories=root.querySelector('#mc-accessories'),drawer=root.querySelector('#mc-drawer'),pull=root.querySelector('#mc-pull');

const rad=Math.PI/180,light=[-.39,-.56,.73];

function restore(saved){const m=saved?.modelContent||{},p=saved?.privateContent||{};if(data.models.some(v=>v.id===m.variant))state.variant=m.variant;if(Number.isFinite(m.doors_degrees))state.open=Math.max(0,Math.min(110,m.doors_degrees));if(Number.isFinite(m.drawer_extension_mm))state.pull=Math.max(0,Math.min(280,m.drawer_extension_mm));if(m.drawer===0||m.drawer===1)state.drawer=m.drawer;if(Number.isFinite(p.yaw))state.yaw=p.yaw;if(Number.isFinite(p.pitch))state.pitch=p.pitch;if(typeof p.accessories==='boolean')state.accessories=p.accessories;guard();sync();draw();}
function guard(){if(state.variant==='inside'&&state.pull>0)state.open=Math.max(95,state.open);}

function draw(){
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);if(!w||!h)return;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const y=state.yaw*rad,p=state.pitch*rad,R=[Math.cos(y),Math.sin(y),0],U=[-Math.sin(y)*Math.sin(p),Math.cos(y)*Math.sin(p),Math.cos(p)],C=[Math.sin(y)*Math.cos(p),-Math.cos(y)*Math.cos(p),Math.sin(p)];
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];const triangles=[];let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;
  const model=data.models.find(m=>m.id===state.variant);
  for(const part of model.parts){
    if(part.group==='accessory'&&!state.accessories)continue;
    const angle=part.group==='door'?part.sign*state.open*rad:0,cs=Math.cos(angle),sn=Math.sin(angle),off=[0,0,0];
    if(part.group==='drawer'&&part.drawer_id===state.drawer)off[1]=-state.pull;
    const vv=part.v.map(a=>{let b=a.slice();if(angle){const x=b[0]-part.pivot[0],yy=b[1]-part.pivot[1];b[0]=part.pivot[0]+cs*x-sn*yy;b[1]=part.pivot[1]+sn*x+cs*yy;}b=b.map((v,i)=>v+off[i]-[500,250,600][i]);const sx=dot(b,R),sy=-dot(b,U),z=dot(b,C);minx=Math.min(minx,sx);maxx=Math.max(maxx,sx);miny=Math.min(miny,sy);maxy=Math.max(maxy,sy);return[sx,sy,z];});
    for(let i=0;i<part.f.length;i++){let n=part.normals[i];if(angle)n=[cs*n[0]-sn*n[1],sn*n[0]+cs*n[1],n[2]];if(dot(n,C)<-.01)continue;const f=part.f[i],a=vv[f[0]],b=vv[f[1]],c=vv[f[2]],color=data.colors[part.material],shade=(.53+.65*Math.max(0,dot(n,light)))*(part.edge[i]?1.21:1);triangles.push({points:[a,b,c],z:(a[2]+b[2]+c[2])/3,color:'rgb('+color.slice(0,3).map(c=>Math.min(255,Math.round(c*shade))).join(',')+')'});}
  }
  const scale=Math.min((w-22)/(maxx-minx),(h-20)/(maxy-miny)),cx=(minx+maxx)/2,cy=(miny+maxy)/2;

}

opened.addEventListener('input',()=>{state.open=+opened.value;if(state.variant==='inside'&&state.open<95)state.pull=0;sync();draw();});opened.addEventListener('change',save);
drawer.addEventListener('change',()=>{state.drawer=+drawer.value;sync();draw();save();});
pull.addEventListener('input',()=>{state.pull=+pull.value;guard();sync();draw();});pull.addEventListener('change',save);

canvas.addEventListener('pointermove',e=>{if(!drag)return;state.yaw=((drag[2]+(e.clientX-drag[0])*.45+540)%360)-180;state.pitch=Math.max(-12,Math.min(65,drag[3]+(e.clientY-drag[1])*.25));sync();draw();});
canvas.addEventListener('pointerup',()=>{drag=null;save();});canvas.addEventListener('pointercancel',()=>{drag=null;});
new ResizeObserver(draw).observe(canvas);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
restore(window.openai?.widgetState);sync();draw();
